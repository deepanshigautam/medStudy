<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Study MBBS abroad at top-ranked universities. Get world-class medical education and shape your future with MedStudy's comprehensive programs across 30+ countries."
    />
    <meta
      name="keywords"
      content="MBBS abroad, medical education, study medicine, international medical schools, medical studies"
    />
    <meta name="author" content="MedStudy" />
    <meta property="og:title" content="MedStudy - Study MBBS Abroad" />
    <meta
      property="og:description"
      content="Get world-class medical education from top-ranked universities. Join thousands of successful medical professionals studying abroad."
    />
    <meta property="og:type" content="website" />
    <title>MedStudy - Study MBBS Abroad</title>
    <link
      href="https://unpkg.com/tailwindcss@^2.0/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-4B1ZZ4ZG5Z"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-4B1ZZ4ZG5Z");
    </script>
  </head>
  <body class="bg-[#ddead1] overflow-x-hidden">
    <!-- Floating Background Elements -->
    <div class="floating-bg"></div>
    <div class="floating-bg"></div>
    <div class="floating-bg"></div>

    <!-- Skip to main content for accessibility -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:p-4"
      >Skip to main content</a
    >

    <!-- Navbar -->
    <nav
      class="bg-white/90 backdrop-blur-sm shadow-md sticky top-0 z-50 transition-all duration-300"
      aria-label="Main navigation"
    >
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center py-4">
          <!-- Left: Logo -->
          <a
            href="#"
            class="text-2xl font-bold text-[#4b6043] hover:scale-105 transition-transform"
            aria-label="MedStudy Home"
            >MedStudy</a
          >

          <!-- Center: Nav Links -->
          <div class="hidden md:flex space-x-8 stagger-children">
            <a href="#hero" class="nav-link text-[#658354] hover:text-[#4b6043]"
              >Home</a
            >
            <a
              href="#features"
              class="nav-link text-[#658354] hover:text-[#4b6043]"
              >Features</a
            >
            <a
              href="#countries"
              class="nav-link text-[#658354] hover:text-[#4b6043]"
              >Countries</a
            >
            <a
              href="#apply"
              class="nav-link text-[#658354] hover:text-[#4b6043]"
              >Guide</a
            >
          </div>

          <!-- Right: Contact Button -->
          <a
            href="#footer"
            class="hidden md:block px-5 py-2 bg-[#87ab69] text-white rounded-lg hover:bg-[#75975e] transition-all duration-300 hover:scale-105 focus:ring-2 focus:ring-offset-2 focus:ring-[#87ab69]"
          >
            Contact
          </a>

          <!-- Mobile Menu Button -->
          <button
            id="menu-btn"
            class="md:hidden text-[#658354] p-2 rounded-lg hover:bg-[#f5f5f5] transition-colors"
            aria-label="Toggle menu"
            aria-expanded="false"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              ></path>
            </svg>
          </button>
        </div>

        <!-- Mobile Menu -->
        <div
          id="mobile-menu"
          class="hidden md:hidden flex flex-col space-y-4 pb-4"
          aria-label="Mobile navigation"
        >
          <a
            href="#features"
            class="nav-link text-[#658354] px-4 py-2 hover:bg-[#f5f5f5] rounded transition-colors"
            >Features</a
          >
          <a
            href="#countries"
            class="nav-link text-[#658354] px-4 py-2 hover:bg-[#f5f5f5] rounded transition-colors"
            >Countries</a
          >
          <a
            href="#apply"
            class="nav-link text-[#658354] px-4 py-2 hover:bg-[#f5f5f5] rounded transition-colors"
            >Guide</a
          >
          <a
            href="#footer"
            class="block mx-4 px-5 py-2 bg-[#87ab69] text-white rounded-lg text-center hover:bg-[#75975e] transition-all duration-300 hover:scale-105"
          >
            Contact
          </a>
        </div>
      </div>
    </nav>

    <main id="main-content">
      <div id="hero"></div>
      <div id="features"></div>
      <div id="countries"></div>
      <div id="apply"></div>
    </main>

    <div id="footer"></div>
    <script src="script.js"></script>
  </body>
</html>
